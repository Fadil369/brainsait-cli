[project]
name = "brainsait-apple-bridge"
version = "0.1.0"
description = "BrainSAIT MCP connector bridging Apple Shortcuts and Automator to Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BrainSAIT" }]
dependencies = [
    "mcp[cli]>=2.0.0",
]

[project.scripts]
brainsait-apple-bridge = "brainsait_apple_bridge.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainsait_apple_bridge"]
